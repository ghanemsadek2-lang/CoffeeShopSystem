# Copy this file to config/application.properties and provide local values.
# application.properties is ignored by Git. Never commit real credentials.
# Every value can be overridden with its COFFEESHOP_* environment variable.

database.url=jdbc:sqlserver://<host>:<port>;databaseName=<database>;encrypt=true;trustServerCertificate=false
database.authentication=SQL_SERVER
database.username=<username>
database.password=<password>

database.pool.maximum-size=5
database.pool.minimum-idle=1
database.pool.connection-timeout-ms=10000
database.pool.validation-timeout-ms=5000
database.pool.idle-timeout-ms=300000
database.pool.max-lifetime-ms=1800000
