# Copy this file to application.properties and provide environment-specific values.
# Never commit application.properties or real credentials.

database.url=jdbc:sqlserver://<host>:<port>;databaseName=<database>;encrypt=true;trustServerCertificate=false
database.username=<username>
database.password=<password>
database.pool.maximum-size=<maximum-pool-size>
database.pool.minimum-idle=<minimum-idle-connections>
database.pool.connection-timeout-ms=<connection-timeout-milliseconds>

application.environment=<environment-name>
